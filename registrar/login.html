<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar Login | ATCRS</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="auth-page">

    <!-- =========================================
         REGISTRAR LOGIN
         ========================================= -->

    <main class="auth-container">

        <section class="auth-card registrar-auth-card">

            <!-- Logo -->
            <div class="auth-logo">

                <img src="../images/dlsjbc-logo.png"
                     alt="DLSJBC Logo">

            </div>


            <!-- System Information -->
            <div class="auth-heading">

                <h1>
                    Registrar Login
                </h1>

                <p>
                    Automated Transcript and Credential
                    Retrieval System
                </p>

                <span class="private-label">

                    <i class="fas fa-lock"></i>

                    Private Administrative Area

                </span>

            </div>


            <!-- Login Form -->
            <form id="registrarLoginForm">

                <!-- Registrar ID -->
                <div class="form-group">

                    <label for="registrarId">

                        <i class="fas fa-id-badge"></i>

                        Registrar ID

                    </label>

                    <input
                        type="text"
                        id="registrarId"
                        name="registrarId"
                        placeholder="Enter Registrar ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registrarPassword">

                        <i class="fas fa-lock"></i>

                        Password

                    </label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="registrarPassword"
                            name="registrarPassword"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registrarPassword"
                            aria-label="Show or hide password"
                        >

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Remember Me -->
                <div class="auth-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="registrarRemember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- Login Message -->
                <div
                    id="registrarLoginMessage"
                    class="form-message"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn-primary auth-submit"
                >

                    <i class="fas fa-sign-in-alt"></i>

                    Sign In

                </button>

            </form>


            <!-- Development Account Information -->
            <div class="security-notice">

                <i class="fas fa-shield-alt"></i>

                <div>

                    <strong>
                        Restricted Access
                    </strong>

                    <p>
                        This area is intended only for
                        authorized DLSJBC Registrar personnel.
                    </p>

                </div>

            </div>


            <!-- Back to Public Login -->
            <div class="auth-back">

                <a href="../login.html">

                    <i class="fas fa-arrow-left"></i>

                    Back to Public Login

                </a>

            </div>

        </section>

    </main>


    <!-- Main JavaScript -->
    <script src="../js/script.js"></script>

</body>

</html>
