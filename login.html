<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Account Login | ATCRS</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="auth-page">

<main class="auth-container">

    <section class="auth-card">

        <!-- LOGO -->

        <div class="auth-logo">

            <img src="images/dlsjbc-logo.png"
                 alt="DLSJBC Logo">

        </div>


        <!-- TITLE -->

        <div class="auth-heading">

            <h1>ATCRS Login</h1>

            <p>
                Automated Transcript and Credential
                Retrieval System
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">

                <label for="loginStudentId">

                    <i class="fas fa-id-card"></i>

                    Student ID

                </label>

                <input
                    type="text"
                    id="loginStudentId"
                    placeholder="Enter 7-digit Student ID"
                    maxlength="7"
                    inputmode="numeric"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">

                    <i class="fas fa-lock"></i>

                    Password

                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div
                id="loginMessage"
                class="form-message">
            </div>


            <button
                type="submit"
                class="btn-primary auth-submit">

                <i class="fas fa-sign-in-alt"></i>

                Sign In

            </button>

        </form>


        <!-- CREATE ACCOUNT -->

        <div class="auth-register">

            <p>
                Don't have an account?
            </p>

            <a href="#register"
               id="showRegisterButton">

                Create an Account

            </a>

        </div>

    </section>


    <!-- =========================================
         REGISTRATION CARD
         ========================================= -->

    <section
        class="auth-card"
        id="registerCard"
        style="display:none;">

        <div class="auth-heading">

            <h1>Create Account</h1>

            <p>
                Create your ATCRS public account
            </p>

        </div>


        <form id="registerForm">


            <!-- ACCOUNT TYPE -->

            <div class="form-group">

                <label for="accountType">

                    <i class="fas fa-user-tag"></i>

                    Account Type

                </label>

                <select
                    id="accountType"
                    required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="Applicant">
                        Applicant
                    </option>

                    <option value="Student">
                        Student
                    </option>

                    <option value="Alumni">
                        Alumni
                    </option>

                </select>

            </div>


            <!-- STUDENT ID -->

            <div class="form-group">

                <label for="registerStudentId">

                    <i class="fas fa-id-card"></i>

                    Student ID

                </label>

                <input
                    type="text"
                    id="registerStudentId"
                    placeholder="Enter 7-digit Student ID"
                    maxlength="7"
                    inputmode="numeric"
                    required
                >

                <small>
                    Student ID must contain exactly 7 digits.
                </small>

            </div>


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="registerFullName">

                    <i class="fas fa-user"></i>

                    Full Name

                </label>

                <input
                    type="text"
                    id="registerFullName"
                    placeholder="Enter your full name"
                    maxlength="50"
                    required
                >

                <small>
                    Maximum 50 characters.
                </small>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="registerEmail">

                    <i class="fas fa-envelope"></i>

                    Email Address

                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="registerPassword">

                    <i class="fas fa-lock"></i>

                    Password

                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="registerConfirmPassword">

                    <i class="fas fa-lock"></i>

                    Confirm Password

                </label>

                <input
                    type="password"
                    id="registerConfirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                >

            </div>


            <div
                id="registerMessage"
                class="form-message">
            </div>


            <button
                type="submit"
                class="btn-primary auth-submit">

                <i class="fas fa-user-plus"></i>
<!-- =========================================
     TERMS OF USE

    <!-- AGREEMENT -->

    <label class="terms-agreement">

        <input
            type="checkbox"
            id="termsAgreement"
            required
        >

        <span>

            I have read and agree to the
            <strong>Terms of Use and Privacy Agreement.</strong>

        </span>

            </button>


        </form>


        <div class="auth-register">

            <a href="#"
               id="showLoginButton">

                <i class="fas fa-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </section>

</main>


<script src="js/script.js"></script>

</body>

</html>
