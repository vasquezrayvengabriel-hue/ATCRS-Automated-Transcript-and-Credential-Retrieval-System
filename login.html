<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================

         DE LA SALLE JOHN BOSCO COLLEGE
         ========================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ATCRS - Automated Transcript and Credential Retrieval System of De La Salle John Bosco College"
    >

    <meta
        name="author"
        content="De La Salle John Bosco College"
    >

    <title>
        Login | ATCRS - DLSJBC
    </title>


    <!-- =========================================
         GOOGLE FONT
         ========================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link

    <!-- =========================================

    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =========================================
         LOGIN PAGE CSS
         ========================================= -->

    <style>

        /* =========================================
           ROOT COLORS
           ========================================= */

        :root {

            --green: #0b5d3f;

            --green-dark: #063927;

            --green-light: #16845b;

            --gold: #d4af37;

            --gold-light: #f0d878;

            --white: #ffffff;

            --light: #f5f7f6;

            --gray: #dcdcdc;

            --gray-dark: #666666;

            --black: #151515;

            --danger: #b42318;

            --success: #18794e;

        }


        /* =========================================
           RESET
           ========================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            font-family: "Poppins", sans-serif;

            min-height: 100vh;

            color: var(--black);

        }


        button,
        input {

            font-family: inherit;

        }


        a {

            text-decoration: none;

        }


        /* =========================================
           AUTH PAGE
           ========================================= */

        .auth-page {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(6, 57, 39, 0.78),
                    rgba(6, 57, 39, 0.88)
                ),
                url("images/background.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

        }


        /* =========================================
           AUTH CONTAINER
           ========================================= */

        .auth-container {

            width: 100%;

            max-width: 720px;

        }


        /* =========================================
           AUTH CARD
           ========================================= */

        .auth-card {

            background: rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);

            border-top: 6px solid var(--gold);

        }


        /* =========================================
           LOGO
           ========================================= */

        .auth-logo {

            width: 115px;

            height: 115px;

            margin: 0 auto 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: var(--white);

            border-radius: 50%;

            padding: 10px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);

            border: 3px solid var(--gold);

        }


        .auth-logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            border-radius: 50%;

        }


        /* =========================================
           MAIN TITLE
           ========================================= */

        .auth-card h1 {

            text-align: center;

            font-size: 42px;

            font-weight: 800;

            color: var(--green);

            letter-spacing: 2px;

        }


        .auth-subtitle {

            text-align: center;

            font-size: 15px;

            font-weight: 500;

            color: var(--gray-dark);

            margin-top: 4px;

            line-height: 1.6;

        }


        .school-name {

            text-align: center;

            color: var(--green-dark);

            font-size: 14px;

            font-weight: 700;

            margin-top: 8px;

        }


        /* =========================================
           DIVIDER
           ========================================= */

        .auth-divider {

            width: 80px;

            height: 4px;

            background: var(--gold);

            border-radius: 20px;

            margin: 25px auto;

        }


        /* =========================================
           LOGIN HEADING
           ========================================= */

        .auth-card h2 {

            text-align: center;

            color: var(--green-dark);

            font-size: 25px;

            margin-bottom: 8px;

        }


        .auth-description {

            text-align: center;

            color: var(--gray-dark);

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 28px;

        }
                /* =========================================
           FORM STYLING
           ========================================= */

        .form-group {

            margin-bottom: 22px;

        }


        .form-group label {

            display: block;

            color: var(--green-dark);

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        .form-group label i {

            margin-right: 6px;

            color: var(--green);

        }


        /* =========================================
           TEXT INPUT
           ========================================= */

        .form-group input[type="text"],
        .form-group input[type="password"] {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #cfcfcf;

            border-radius: 10px;

            background: var(--white);

            color: var(--black);

            font-size: 14px;

            outline: none;

            transition: all 0.25s ease;

        }


        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {

            border-color: var(--green);

            box-shadow:
                0 0 0 3px rgba(11, 93, 63, 0.10);

        }


        .form-group input::placeholder {

            color: #999;

        }


        /* =========================================
           FORM HELP TEXT
           ========================================= */

        .form-help {

            display: block;

            margin-top: 6px;

            color: #777;

            font-size: 12px;

        }


        /* =========================================
           PASSWORD CONTAINER
           ========================================= */

        .password-input {

            position: relative;

            width: 100%;

        }


        .password-input input {

            padding-right: 75px !important;

        }


        /* =========================================
           SHOW / HIDE PASSWORD BUTTON
           ========================================= */

        .password-toggle {

            position: absolute;

            top: 50%;

            right: 8px;

            transform: translateY(-50%);

            padding: 8px;

            border: none;

            background: transparent;

            color: var(--green);

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .password-toggle:hover {

            color: var(--gold);

        }


        /* =========================================
           LOGIN OPTIONS
           ========================================= */

        .auth-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .remember-option {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #555;

            font-size: 13px;

            cursor: pointer;

        }


        .remember-option input {

            width: 16px;

            height: 16px;

            accent-color: var(--green);

            cursor: pointer;

        }


        /* =========================================
           TERMS OF USE BOX
           ========================================= */

        .terms-box {

            width: 100%;

            margin: 25px 0;

            border: 1px solid #d5d5d5;

            border-radius: 15px;

            background: #fafcfa;

            overflow: hidden;

        }


        /* =========================================
           TERMS HEADER
           ========================================= */

        .terms-header {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 18px 20px;

            background: var(--green);

            color: var(--white);

        }


        .terms-icon {

            width: 43px;

            height: 43px;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-shrink: 0;

            background:
                rgba(255, 255, 255, 0.15);

            border-radius: 50%;

            font-size: 18px;

        }


        .terms-header h3 {

            color: var(--white);

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 2px;

        }


        .terms-header p {

            color: rgba(255, 255, 255, 0.85);

            font-size: 11px;

            line-height: 1.5;

        }


        /* =========================================
           TERMS SCROLL AREA
           ========================================= */

        .terms-content {

            max-height: 360px;

            overflow-y: auto;

            padding: 22px;

            background: var(--white);

        }


        .terms-content::-webkit-scrollbar {

            width: 7px;

        }


        .terms-content::-webkit-scrollbar-track {

            background: #f1f1f1;

        }


        .terms-content::-webkit-scrollbar-thumb {

            background: var(--green);

            border-radius: 10px;

        }


        /* =========================================
           TERMS HEADINGS
           ========================================= */

        .terms-content h4 {

            color: var(--green-dark);

            font-size: 14px;

            font-weight: 700;

            margin-top: 18px;

            margin-bottom: 7px;

        }


        .terms-content h4:first-child {

            margin-top: 0;

        }


        /* =========================================
           TERMS PARAGRAPHS
           ========================================= */

        .terms-content p {

            color: #555;

            font-size: 12px;

            line-height: 1.8;

            margin-bottom: 10px;

        }


        /* =========================================
           TERMS IMPORTANT NOTICE
           ========================================= */

        .terms-note {

            margin-top: 20px;

            padding: 16px;

            border-left: 4px solid var(--gold);

            border-radius: 8px;

            background: #fffaf0;

        }


        .terms-note strong {

            display: block;

            color: var(--green-dark);

            font-size: 13px;

            margin-bottom: 5px;

        }


        .terms-note p {

            margin-bottom: 0;

        }


        /* =========================================
           TERMS AGREEMENT
           ========================================= */

        .terms-agreement {

            padding: 17px 20px;

            border-top: 1px solid #dddddd;

            background: #f4f8f5;

        }


        .terms-agreement label {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            cursor: pointer;

        }


        .terms-agreement input {

            width: 18px;

            height: 18px;

            flex-shrink: 0;

            margin-top: 2px;

            accent-color: var(--green);

            cursor: pointer;

        }


        .terms-agreement span {

            color: #444;

            font-size: 12px;

            line-height: 1.7;

        }


        .terms-agreement strong {

            color: var(--green-dark);

        }
